# Lint settings for the CSG-Fusion code (`ruff check .`). The repository is run from its root
# (`python main.py ...`, `python -m scripts.eval.baselines ...`); it is not an installable package.
[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["third_party", "src/mast3r_src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "B006"]
ignore = ["E402", "E731", "E741", "F722"]  # F722: jaxtyping shape strings such as Float[Tensor, "b 3 3"]
